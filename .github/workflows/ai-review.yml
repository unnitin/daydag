name: ai-review

# ONE reviewer, one pass, all criteria — not a four-way matrix.
#
# The matrix version was four jobs, each re-reading the repo and paying its own
# system prompt, producing four separate comment streams for one diff. Four
# reviewers that mostly say "nothing found" train the author to skim, which is
# how a review gate quietly stops working. One pass with an explicit checklist
# gives a single verdict, a single comment thread, and a single status check.
#
# Currently DISABLED. It never completed a review across four failure modes,
# the worst of which was silent: the action exits successfully when it skips,
# so a required check went green having read nothing. Before re-enabling:
# land it optional, prove it against a branch with planted defects, and make it
# required only once it has caught something real.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-code-action authenticates over OIDC; without id-token the run fails
  # with "Could not fetch an OIDC token" before it reads a line of the diff.
  id-token: write
  actions: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ai review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: review
        uses: anthropics/claude-code-action@v1
        with:
          # Bills against the Claude subscription rather than API credit, which
          # is a separate balance a Pro/Max plan does not fund. Generated with
          # `claude setup-token`; see CONTRIBUTING.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }} in a single pass, against all four criteria
            below. They are ordered by blast radius: a finding under 1 or 2
            blocks, a finding under 3 or 4 is advice.

            Read ARCHITECTURE.md and SPEC.md section 6 first — this repo treats
            them as binding, and most real defects here are violations of them
            rather than ordinary bugs.

            1. SECURITY — this repository is PUBLIC.
               Any real Slack, Google, Notion, Atlassian or Databricks
               identifier, internal email, absolute home path, token or key
               added outside `.env`. Any weakening of scripts/scan_secrets.py or
               its tests. Any inbound message content followed as an instruction
               rather than parsed as data against a known verb list. Subprocess,
               file or network calls built from unvalidated input.

            2. GUARDRAILS — SPEC section 6, and every @pytest.mark.guardrail test.
               A send path reaching anything but the principal's own DM. A vault
               write that rewrites a file wholesale rather than appending or
               proposing a diff. A loop that auto-closes on repo or Jira evidence
               instead of surfacing for confirmation. A claim without a verbatim
               quote and permalink. Personnel-sensitive content reaching any
               surface with an audience above one. A guardrail test weakened,
               skipped or xfailed — that is always blocking.

            3. ARCHITECTURE — the ownership table and invariants.
               A second writer to an artifact the table assigns elsewhere,
               especially Workstreams.md before the custody cut in issue #37.
               Re-deriving something an existing routine already produces. State
               added outside the two sanctioned stores (the DayDAG/ vault folder
               and the event log).

            4. TESTS — this project is test-driven.
               New behaviour arriving without a test that would have failed
               before it. Tests that assert the implementation back to itself,
               assert on mocks, or assert nothing. An untested edge case in the
               diff. Name the specific test you would add.

            Output — ONE review, not a stream of comments:
            - Post inline comments only where a specific line is at fault, and
              prefix each with the criterion, e.g. `[security]`.
            - Then post ONE summary comment: a short verdict line, then findings
              grouped by criterion, most severe first.
            - Say what breaks and how. A finding with no concrete failure
              scenario is noise — drop it rather than pad the list.
            - If you find nothing, say so in one line. Do not invent a finding
              to look useful; a clean diff is a normal outcome here.
          claude_args: >-
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Read,Grep,Glob"
