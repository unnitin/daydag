repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
        exclude: ^tests/test_scan_secrets\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # The repo is public. This is the hook that matters most.
  - repo: local
    hooks:
      - id: no-real-identifiers
        name: block real Slack/Google/Notion/Databricks IDs and internal emails
        entry: python3 scripts/scan_secrets.py
        language: system
        pass_filenames: true
        stages: [pre-commit]

      # Pre-push runs what CI runs. Reviews happen before this, in a session -
      # an LLM review cannot run in a git hook, and does not need to: the
      # deterministic half is what catches the "green locally, red in CI" class.
      - id: preflight
        name: preflight - CI-equivalent checks before pushing
        entry: bash scripts/preflight.sh --fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
