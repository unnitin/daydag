repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
        exclude: ^tests/test_scan_secrets\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # The repo is public. This is the hook that matters most.
  - repo: local
    hooks:
      - id: no-real-identifiers
        name: block real Slack/Google/Notion/Databricks IDs and internal emails
        entry: python3 scripts/scan_secrets.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
