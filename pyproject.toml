[project]
name = "daydag"
version = "0.1.0"
description = "A persistent chief-of-staff agent: briefs, open loops, engineering pulse."
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daydag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts` lives at the repo root and is not part of the installed package;
# CI has no implicit rootdir on sys.path, so make it explicit.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "guardrail: safety property from SPEC.md section 6 - never skip or xfail",
  "integration: touches a real connector; skipped in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]  # `git` on PATH is fine in a test
